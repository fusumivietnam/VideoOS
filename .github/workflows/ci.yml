name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://videoos:videoos@127.0.0.1:5432/videoos
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: videoos
          POSTGRES_USER: videoos
          POSTGRES_PASSWORD: videoos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U videoos -d videoos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, node24
        with:
          version: 10.17.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, node24
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Architecture boundaries
        run: pnpm architecture:check

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Test workspace
        run: pnpm test

      - name: Migrate PostgreSQL
        run: pnpm --filter @videoos/adapter-persistence-postgres migrate

      - name: PostgreSQL durable-core integration
        run: pnpm --filter @videoos/adapter-persistence-postgres test:integration
