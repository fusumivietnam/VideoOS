name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24

      - name: Detect durable integration changes
        id: durable_changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_postgres=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: PostgreSQL integration enabled."
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "run_postgres=false" >> "$GITHUB_OUTPUT"
            echo "Post-merge push: PostgreSQL integration skipped to avoid duplicating the PR gate."
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed_files"

          if grep -Eq '^(packages/adapters/persistence-postgres/|packages/job-queue/|packages/event-fabric/|packages/storage/|services/orchestrator/|apps/local-runtime/src/(index|postgres)\.ts$|infra/compose\.dev\.yml$|\.github/workflows/ci\.yml$)' <<< "$changed_files"; then
            echo "run_postgres=true" >> "$GITHUB_OUTPUT"
            echo "Durable runtime paths changed: PostgreSQL integration enabled."
          else
            echo "run_postgres=false" >> "$GITHUB_OUTPUT"
            echo "No durable runtime paths changed: PostgreSQL integration skipped."
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, node24
        with:
          version: 10.17.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, node24
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Architecture boundaries
        run: pnpm architecture:check

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Test workspace
        run: pnpm test

      - name: PostgreSQL durable integration
        if: steps.durable_changes.outputs.run_postgres == 'true'
        env:
          DATABASE_URL: postgres://videoos:videoos@localhost:5432/videoos
        run: |
          set -euo pipefail

          cleanup() {
            docker compose -f infra/compose.dev.yml down -v
          }
          trap cleanup EXIT

          docker compose -f infra/compose.dev.yml up -d postgres

          for attempt in $(seq 1 30); do
            if docker compose -f infra/compose.dev.yml exec -T postgres pg_isready -U videoos -d videoos; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              docker compose -f infra/compose.dev.yml logs postgres
              exit 1
            fi
            sleep 1
          done

          pnpm --filter @videoos/adapter-persistence-postgres migrate
          pnpm --filter @videoos/adapter-persistence-postgres test:integration
