services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      VIDEOOS_WEB_HOST: 0.0.0.0
      VIDEOOS_WEB_PORT: 3000
      VIDEOOS_WEB_ALLOW_UNAUTHENTICATED_NON_LOOPBACK: 1
      VIDEOOS_WEB_ACCESS_CODE: ${VIDEOOS_WEB_ACCESS_CODE:-}
      VIDEOOS_WEB_SESSION_SECRET: ${VIDEOOS_WEB_SESSION_SECRET:-}
      VIDEOOS_WEB_COOKIE_SECURE: ${VIDEOOS_WEB_COOKIE_SECURE:-0}
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
