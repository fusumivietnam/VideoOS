services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: videoos
      POSTGRES_USER: videoos
      POSTGRES_PASSWORD: videoos
    ports:
      - "5432:5432"
    volumes:
      - videoos-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videoos -d videoos"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  videoos-postgres:
